name: Deploy Code to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-06ea3e388448b991c
  APP_DIR: /opt/capitalone_marketing_model
  REPO_URL: https://github.com/vineetsinghal2706/capitalone_marketing_model_1.git

jobs:
  validate:
    name: Unit and Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas==2.2.2 numpy==1.26.4 pyarrow==17.0.0

      - name: Compile Python
        run: |
          python -m compileall -q jobs scoring airflow

      - name: Run unit and smoke tests
        run: |
          pytest -q

  deploy:
    name: Deploy repository to EC2
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AWS role variable
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$DEPLOY_ROLE_ARN" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is empty or not configured."
            echo "Go to GitHub -> Settings -> Secrets and variables -> Actions -> Variables"
            echo "Create repository variable: AWS_DEPLOY_ROLE_ARN"
            exit 1
          fi
          echo "AWS_DEPLOY_ROLE_ARN is configured."

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Create SSM deployment parameters file
        run: |
          cat > /tmp/deploy-parameters.json <<'JSON'
          {
            "commands": [
              "set -euo pipefail",
              "export HOME=/root",
              "if ! command -v git >/dev/null 2>&1; then echo 'Git is not installed on EC2'; exit 1; fi",
              "mkdir -p /opt/capitalone_marketing_model",
              "git config --global --add safe.directory /opt/capitalone_marketing_model",
              "cd /opt/capitalone_marketing_model",
              "if [ -d .git ]; then git remote set-url origin https://github.com/vineetsinghal2706/capitalone_marketing_model_1.git; git fetch origin main; git reset --hard origin/main; else find /opt/capitalone_marketing_model -mindepth 1 -maxdepth 1 -exec rm -rf {} +; git clone https://github.com/vineetsinghal2706/capitalone_marketing_model_1.git .; fi",
              "echo '===== DISK SPACE BEFORE INSTALL ====='",
              "df -h / /opt",
              "rm -rf /root/.cache/pip",
              "rm -rf /tmp/*",
              "mkdir -p /opt/capitalone_marketing_model",
              "if [ -d .venv ]; then echo 'Reusing existing virtual environment'; else python3 -m venv .venv; fi",
              ".venv/bin/python -m pip install --no-cache-dir --upgrade pip",
              ".venv/bin/pip install --no-cache-dir -r requirements.txt",
              "rm -rf /root/.cache/pip",
              "echo '===== DISK SPACE AFTER INSTALL ====='",
              "df -h / /opt",
              "mkdir -p /opt/airflow/dags",
              "cp airflow/dags/*.py /opt/airflow/dags/",
              "chmod 644 /opt/airflow/dags/*.py",
              "echo DEPLOYMENT_COMPLETED"
            ]
          }
          JSON

      - name: Deploy code using SSM
        run: |
          DEPLOY_COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy capitalone_marketing_model_1 to EC2" \
            --parameters file:///tmp/deploy-parameters.json \
            --query "Command.CommandId" \
            --output text \
            --region "$AWS_REGION")

          echo "Deployment command: $DEPLOY_COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$DEPLOY_COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" || true

          echo "===== DEPLOYMENT OUTPUT ====="
          aws ssm get-command-invocation \
            --command-id "$DEPLOY_COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          DEPLOY_STATUS=$(aws ssm get-command-invocation \
            --command-id "$DEPLOY_COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text \
            --region "$AWS_REGION")

          echo "Deployment status: $DEPLOY_STATUS"

          if [ "$DEPLOY_STATUS" != "Success" ]; then
            echo "::error::EC2 deployment failed. See SSM output above."
            exit 1
          fi

      - name: Create SSM verification parameters file
        run: |
          cat > /tmp/verify-parameters.json <<'JSON'
          {
            "commands": [
              "set -e",
              "export HOME=/root",
              "git config --global --add safe.directory /opt/capitalone_marketing_model",
              "cd /opt/capitalone_marketing_model",
              "echo REMOTE=$(git remote get-url origin)",
              "echo COMMIT=$(git rev-parse --short HEAD)",
              "ls -la jobs",
              "ls -la airflow/dags",
              ".venv/bin/python --version"
            ]
          }
          JSON

      - name: Verify EC2 deployment
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/verify-parameters.json \
            --query "Command.CommandId" \
            --output text \
            --region "$AWS_REGION")

          echo "Verification command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" || true

          echo "===== VERIFICATION OUTPUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          VERIFY_STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text \
            --region "$AWS_REGION")

          echo "Verification status: $VERIFY_STATUS"

          if [ "$VERIFY_STATUS" != "Success" ]; then
            echo "::error::EC2 verification failed. See SSM output above."
            exit 1
          fi

      - name: Deployment completed
        run: |
          echo "Code deployed to EC2 successfully."
          echo "Repository: capitalone_marketing_model_1"
          echo "Docker and ECR are not used by this workflow."
